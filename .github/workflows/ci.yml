name: SDK checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep PR feedback lean while retaining full compatibility coverage on
        # main pushes and manual runs.
        node: ${{ fromJSON(github.event_name == 'pull_request' && '[22]' || '[20, 22, 24]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned pnpm
        run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@10.8.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Run browser smoke test
        if: matrix.node == 22
        run: pnpm smoke:browser
      - name: Verify cold-store reproducibility
        if: matrix.node == 22
        run: pnpm check:cold
